id = 0

[router]
id = 0
max_connections = 10000
max_outgoing_packet_count = 200
max_segment_size = 104857600
max_segment_count = 10

# PostgreSQL（ACL / 管理后台）
[database]
url = "postgresql://himqtt:himqtt@127.0.0.1:5432/himqtt"
max_connections = 5

[acl]
enabled = true
enforce_registered_topics = true
cache_refresh_secs = 10

[admin]
listen = "127.0.0.1:8091"
default_password = "admin123"
static_dir = "admin-web/dist"

# MQTT 3.1.1，标准端口 1883
[v4.1]
name = "mqtt-v4"
listen = "0.0.0.0:1883"
next_connection_delay_ms = 1
    [v4.1.connections]
    connection_timeout_ms = 60000
    max_payload_size = 262144
    max_inflight_count = 100
    dynamic_filters = false

# MQTT 5.0
[v5.1]
name = "mqtt-v5"
listen = "0.0.0.0:1884"
next_connection_delay_ms = 1
    [v5.1.connections]
    connection_timeout_ms = 60000
    max_payload_size = 262144
    max_inflight_count = 100
    dynamic_filters = false

# WebSocket（浏览器 / 前端客户端）
[ws.1]
name = "mqtt-ws"
listen = "0.0.0.0:8083"
next_connection_delay_ms = 1
    [ws.1.connections]
    connection_timeout_ms = 60000
    max_client_id_len = 256
    max_payload_size = 262144
    max_inflight_count = 500
    dynamic_filters = false

# 管理控制台（rumqttd JSON API）
[console]
listen = "127.0.0.1:3030"

# Prometheus 指标
[prometheus]
listen = "127.0.0.1:9042"
interval = 5

# 周期性推送连接/订阅指标给监控页（alerts 段需同时存在，避免 rumqttd timer panic）
[metrics.meters]
push_interval = 2

[metrics.alerts]
push_interval = 30

# HiMQTT 监控（数据采集，Web 界面已并入管理后台 :8091）
[monitor]
max_messages = 500
