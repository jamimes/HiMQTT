[package]
name = "himqtt"
version = "0.1.0"
edition = "2021"
description = "基于 rumqttd 的 MQTT 服务器，适用于 Ubuntu/Linux"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = "0.14"
futures-util = "0.3"
rumqttd = { path = "crates/rumqttd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"

[patch.crates-io]
rumqttd = { path = "crates/rumqttd" }
